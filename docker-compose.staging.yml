# Recette / démonstration uniquement. En production : base gérée, secrets du gestionnaire de votre hébergeur, TLS devant l'application.
# Usage : cp .env.example .env.staging (puis renseigner) ; docker compose -f docker-compose.staging.yml --env-file .env.staging up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ggt
      POSTGRES_USER: ggt_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?à définir}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ggt_owner -d ggt"]
      interval: 5s
      retries: 10
  migrate:
    build: { context: ., target: tools }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://ggt_owner:${DB_OWNER_PASSWORD}@db:5432/ggt
  app:
    build: { context: ., target: app }
    depends_on: { migrate: { condition: service_completed_successfully } }
    ports: ["127.0.0.1:3000:3000"] # à placer derrière un proxy TLS qui écrase X-Forwarded-For
    environment:
      DATABASE_URL: postgres://ggt_app:${DB_APP_PASSWORD:?à définir}@db:5432/ggt
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?à définir}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?à définir (https)}
      EMAIL_MODE: smtp
      SMTP_URL: ${SMTP_URL:?à définir}
      EMAIL_FROM: ${EMAIL_FROM:?à définir}
    volumes: [storage:/var/lib/ggt/storage]
volumes:
  dbdata:
  storage:
